# shufa-tool — 书法/作业讲评视频分析 CLI
#
# 意图（原始需求 2026-09-22）：
#   1. 输入讲评视频（可能有旋转问题），自动转正
#   2. 检测田字格，截取格内字
#   3. 提取讲解过程中老师写的旁注及其出现时间
#   4. 转录讲解音频并总结教学内容
#   5. 产出自包含 HTML 报告
[project]
name = "shufa-tool"
version = "0.1.0"
description = "书法/作业讲评视频 → 田字格字提取 + 旁注时间线 + 转录摘要 HTML"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10",
    "numpy>=1.26",
]
[project.optional-dependencies]
# W9（2026-09-27）平台最优转录引擎：mac=mlx-whisper（arm64 构建）、
# win/linux=faster-whisper（CTranslate2，自带 ctranslate2/huggingface_hub/
# onnxruntime 轮子，无编译链）。httpx[socks] 供 warm_whisper 元数据请求在
# SOCKS 代理网络可用，全平台随 extra 安装。
transcribe = [
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1; sys_platform == 'win32' or sys_platform == 'linux'",
    "httpx[socks]>=0.27",
]
[project.scripts]
shufa-analyze = "shufa_tool.cli:main"
shufa-serve = "shufa_tool.serve:serve_bundle_main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/shufa_tool"]
